# XcodeGen spec. Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: SecondScreen
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SecondScreen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SecondScreen
    settings:
      base:
        # Change this to something unique to you (e.g. com.yourname.secondscreen) before signing.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.secondscreen
        INFOPLIST_FILE: SecondScreen/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"        # iPad only
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: ABCDE12345     # your Apple team ID (Xcode > Signing & Capabilities)
    scheme: {}
